<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Math Run · Night Parade</title>
  <meta name="description" content="A 3D handwriting math game: write answers on a talisman to banish yokai. Digit recognition runs in your browser with TensorFlow.js." />
  <meta name="theme-color" content="#140f2e" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="./favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="stylesheet" href="./styles.css" />

  <!-- TensorFlow.js (+ WASM backend) for in-browser digit recognition -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-wasm@4.22.0/dist/tf-backend-wasm.min.js"></script>

  <!-- Three.js via import map: no build step, GitHub Pages serves these files as-is -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.5.5/lib/three-vrm.module.min.js"
      }
    }
  </script>
</head>

<body>
  <div id="app">
    <!-- 3D stage -->
    <div id="stage">
      <canvas id="scene" aria-label="3D game view"></canvas>
      <div id="labels" aria-live="off"></div>
      <div id="popups" aria-hidden="true"></div>
      <div id="vignette" aria-hidden="true"></div>
      <div id="banner" class="banner" aria-live="polite"></div>
      <div id="skip-hint" class="skip-hint" data-i18n="skip"></div>
      <div id="countdown" class="countdown" aria-live="assertive"></div>

      <header id="hud">
        <div class="hud-left">
          <div id="hearts" class="hearts"></div>
          <div id="rank-chip" class="rank-chip">
            <span id="rank-seal" class="stamp" aria-hidden="true"></span>
            <div class="rank-text">
              <div class="rank-line"><b id="rank-name"></b><span id="rank-hint" class="rank-hint"></span></div>
              <div class="rank-bar" aria-hidden="true"><i id="rank-fill"></i></div>
            </div>
          </div>
          <div id="combo" class="combo"></div>
        </div>
        <div class="hud-right">
          <div class="score-box">
            <div id="score" class="score">0</div>
            <div class="score-sub"><span id="dist">0</span> m · <span data-i18n="best"></span> <span id="best">0</span></div>
          </div>
          <div class="hud-btns">
            <button id="btn-ai" class="icon-btn" aria-label="AI view">AI</button>
            <button id="btn-lang" class="icon-btn" aria-label="Language" data-i18n="lang"></button>
            <button id="btn-mute" class="icon-btn" aria-label="Sound">
              <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </button>
            <button id="btn-pause" class="icon-btn" aria-label="Pause">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
            </button>
          </div>
        </div>
      </header>
    </div>

    <!-- Writing dock: AI panel + talisman -->
    <div id="dock">
      <aside id="ai-panel" class="panel" aria-label="AI view">
        <div class="ai-head"><span data-i18n="aiTitle"></span><span id="ai-meta" class="ai-meta"></span></div>
        <div class="ai-body">
          <canvas id="ai-input" width="28" height="28" aria-label="28×28 model input"></canvas>
          <ol id="ai-top" class="ai-top"></ol>
        </div>
        <div id="ai-verdict" class="ai-verdict"></div>
      </aside>

      <div id="talisman" class="talisman">
        <div class="tal-head" aria-hidden="true">敕令</div>
        <canvas id="pad" aria-label="Handwrite your answer here"></canvas>
        <div class="tal-foot" aria-hidden="true">急急如律令</div>
        <div id="guess" class="guess" aria-hidden="true"></div>
        <div id="pad-timer" class="pad-timer" aria-hidden="true"><i></i></div>
        <div id="pad-toast" class="pad-toast" role="status"></div>
      </div>
    </div>

    <!-- Title -->
    <section id="ov-title" class="overlay title">
      <div class="title-watermark" aria-hidden="true">百鬼夜行</div>
      <div class="card title-card">
        <div class="kicker">
          <svg class="crest" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="27" fill="none" stroke="currentColor" stroke-width="4.5" />
            <path d="M32 9L45.52 50.61L10.13 24.89H53.87L18.48 50.61Z" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linejoin="round" />
          </svg>
          <span data-i18n="kicker"></span>
        </div>
        <div class="logo-row">
          <h1 class="logo">MATH RUN</h1>
          <svg class="seal" viewBox="0 0 100 100" aria-hidden="true">
            <defs>
              <filter id="seal-rough" x="-10%" y="-10%" width="120%" height="120%">
                <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="7" />
                <feDisplacementMap in="SourceGraphic" scale="5" />
              </filter>
            </defs>
            <g filter="url(#seal-rough)">
              <rect x="6" y="6" width="88" height="88" rx="9" fill="#d3362b" />
              <rect x="13.5" y="13.5" width="73" height="73" rx="5" fill="none" stroke="#fff1de" stroke-width="3" />
              <text x="50" y="54" text-anchor="middle" dominant-baseline="middle" font-size="60" font-weight="700" fill="#fff1de"
                font-family="Kaiti SC, STKaiti, KaiTi, BiauKai, serif">算</text>
            </g>
          </svg>
        </div>
        <div class="sub-logo" data-i18n="subtitle"></div>
        <p class="tagline" data-i18n="tagline"></p>
        <ul class="how">
          <li>
            <svg class="how-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5v3" /><path d="M4.5 9.2 12 5.5l7.5 3.7V19h-15z" /><path d="M9.3 13.6h5.4M12 10.9v5.4" /></svg>
            <span data-i18n="how1"></span>
          </li>
          <li>
            <svg class="how-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3" width="9" height="18" rx="1" /><path d="M6 7.5h4M6 10.5h4M6 13.5h2.5" /><path d="M20.5 4.5 14.8 15.6" /><path d="m14.8 15.6-1.6 3.6 2.9-2.4" /></svg>
            <span data-i18n="how2"></span>
          </li>
          <li>
            <svg class="how-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="2.3" /><path d="M7.5 11 16.6 5.6M7.6 12h8.9M7.5 13l9.1 5.4" /><circle cx="18.8" cy="5" r="1.9" /><circle cx="18.8" cy="12" r="1.9" /><circle cx="18.8" cy="19" r="1.9" /></svg>
            <span data-i18n="how3"></span>
          </li>
        </ul>
        <button id="btn-start" class="btn primary start" disabled>
          <svg class="btn-crest" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 6L47.3 53.1L7.2 24H56.8L16.7 53.1Z" fill="none" stroke="currentColor" stroke-width="6" stroke-linejoin="round" /></svg>
          <span id="start-label" data-i18n="loading"></span>
        </button>
        <div class="title-meta">
          <span class="meta-chip rank"><span data-i18n="bestRank"></span><ol id="title-ladder" class="ladder mini"></ol></span>
          <span id="title-best" class="meta-chip best"></span>
          <span id="ai-chip" class="meta-chip ai"><i class="dot"></i><span id="ai-status" data-i18n="loading"></span></span>
        </div>
      </div>
    </section>

    <!-- Opening tutorial: spotlight + speech bubble + writing demo -->
    <div id="tut" class="tut" hidden>
      <div id="tut-hole" class="tut-hole"></div>
      <svg id="tut-demo" class="tut-demo" viewBox="0 0 100 140" preserveAspectRatio="xMidYMid meet" hidden aria-hidden="true">
        <path id="tut-demo-path" d="M27 38C30 17 74 14 74 40C74 58 58 66 45 68C63 68 80 78 78 100C76 126 33 131 22 111" />
        <g id="tut-finger" class="tut-finger">
          <circle cx="9" cy="1.5" r="6" />
          <path d="M7.5 3a1.5 1.5 0 0 1 3 0V10a1.35 1.35 0 0 1 2.7 0v.6a1.35 1.35 0 0 1 2.7 0v.8a1.25 1.25 0 0 1 2.5 0V16.5c0 3.2-2.2 5.5-5.5 5.5h-2.2c-1.8 0-3-.8-3.9-2.1L3.6 15.2a1.3 1.3 0 0 1 2.1-1.5L7.5 15.5Z" />
        </g>
      </svg>
      <div id="tut-bubble" class="tut-bubble" role="dialog" aria-live="polite" hidden>
        <div class="tut-head">
          <svg class="crest" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="32" r="27" fill="none" stroke="currentColor" stroke-width="5" />
            <path d="M32 9L45.52 50.61L10.13 24.89H53.87L18.48 50.61Z" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" />
          </svg>
          <b id="tut-title"></b>
          <button id="tut-skip" class="tut-skip" data-i18n="tutSkip"></button>
        </div>
        <p id="tut-text"></p>
        <div id="tut-actions" class="tut-actions"></div>
      </div>
    </div>

    <!-- Pause -->
    <section id="ov-pause" class="overlay" hidden>
      <div class="card small-card">
        <h2 data-i18n="paused"></h2>
        <button id="btn-resume" class="btn primary" data-i18n="resume"></button>
        <button id="btn-quit" class="btn ghost" data-i18n="quit"></button>
      </div>
    </section>

    <!-- Game over -->
    <section id="ov-over" class="overlay over" hidden>
      <div class="card small-card">
        <h2 data-i18n="overTitle"></h2>
        <div id="over-newbest" class="newbest" data-i18n="newBest" hidden></div>
        <div id="over-score" class="big-score">0</div>
        <dl class="stats">
          <div><dt data-i18n="statBanished"></dt><dd id="st-banished"></dd></div>
          <div><dt data-i18n="statCombo"></dt><dd id="st-combo"></dd></div>
          <div><dt data-i18n="statDist"></dt><dd id="st-dist"></dd></div>
          <div class="rank-stat">
            <dt data-i18n="statRank"></dt><dd id="st-rank"></dd>
            <ol id="over-ladder" class="ladder"></ol>
            <p id="over-next" class="ladder-note"></p>
            <svg id="st-curve" viewBox="0 0 200 44" preserveAspectRatio="none" aria-hidden="true"><path class="area" /><path class="line" /></svg>
          </div>
          <div><dt data-i18n="statAI"></dt><dd id="st-ai"></dd></div>
        </dl>
        <button id="btn-retry" class="btn primary" data-i18n="retry"></button>
        <button id="btn-over-title" class="btn ghost" data-i18n="quit"></button>
      </div>
    </section>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
